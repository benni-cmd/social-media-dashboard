<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WEE Social Media Suit</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Geometrie des Einstellungsfensters (v29) — NACH style.css, ueberschreibt dessen Groessen. -->
    <link rel="stylesheet" href="einstellungen.css" />
  </head>
  <body>
    <header class="kopf">
      <!-- v103: drei feste Zonen — Marke + Ansichten | Hauptaktion | Verbindungen + System -->
      <div class="kopf-marke">
      <span class="kopf-logo" aria-hidden="true"></span>
      <span class="kopf-titel">WEE Social Media Suit</span>

      <div class="ansichten" role="group" aria-label="Ansicht waehlen">
        <button class="ansicht-knopf" id="zu-board" aria-pressed="true">Board</button>
        <button class="ansicht-knopf" id="zu-auswertung" aria-pressed="false">Auswertung</button>
      </div>
      </div>

      <div class="kopf-mitte">
      <button class="knopf knopf-haupt" id="naechster-schritt" title="Oeffnet automatisch die sinnvollste offene Karte.">
        <span>Naechster Schritt</span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <button class="live-plakette" id="live-stand" type="button" hidden></button>
      </div>

      <div class="kopf-rechts">
        <div id="anschluesse" class="kopf-anschluesse"></div>
        <span id="stand" class="kopf-stand">Bereit.</span>
        <div class="kopf-menu">
          <button class="knopf knopf-symbol" id="kopf-menu-knopf" title="Weitere Aktionen" aria-haspopup="true" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <div class="kopf-menu-liste" id="kopf-menu-liste" role="menu" aria-labelledby="kopf-menu-knopf" hidden>
            <div class="kopf-menu-gruppe" role="group" aria-label="Daten">
              <button class="kopf-menu-item" id="abgleichen" role="menuitem" tabindex="-1" title="Alle Anschluesse nacheinander abrufen und aktualisieren: Zahlen der Plattformen, Drive-Ordner, Google Kalender und Tasks">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                <span>Alles abgleichen</span>
              </button>
              <button class="kopf-menu-item" id="neuladen" role="menuitem" tabindex="-1" title="Board-Stand neu laden">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                <span>Aktualisieren</span>
              </button>
            </div>
            <div class="kopf-menu-trenner" role="separator"></div>
            <div class="kopf-menu-gruppe" role="group" aria-label="System">
              <button class="kopf-menu-item" id="einstellungen" role="menuitem" tabindex="-1" title="Einstellungen">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>Einstellungen</span>
              </button>
            </div>
          </div>
        </div>
        <div class="shutdown-slider" id="shutdown-slider" title="Schieben zum Beenden">
          <span class="shutdown-label">Beenden</span>
          <div class="shutdown-handle" id="shutdown-handle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
          </div>
        </div>
      </div>
    </header>

    <div class="hauptflaeche" id="hauptflaeche">
      <section class="ansicht" id="ansicht-board">
        <div class="board-leiste" id="board-leiste">
          <div class="drehleiste" id="drehleiste"></div>
          <div class="wochenlast" id="wochenlast"></div>
        </div>
        <div class="board-scroll" id="board-scroll">
          <div class="nachschub" id="nachschub"></div>
          <div class="board" id="board"></div>
        </div>
        <!-- v102: Board-Zoom, nur auf der Board-Ebene (liegt in dieser Ansicht, rutscht mit der Detailspalte) -->
        <div class="board-zoom" id="board-zoom" role="group" aria-label="Board vergroessern oder verkleinern"></div>
      </section>

      <section class="ansicht" id="ansicht-auswertung" hidden></section>

      <div class="detail-griff" id="detail-griff" hidden title="Breite ziehen"></div>
      <aside class="detail" id="detail" hidden></aside>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
